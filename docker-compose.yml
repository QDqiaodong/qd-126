services:
  mysql:
    image: ${DOCKER_REGISTRY}mysql:8.0
    container_name: qd-126-mysql
    ports:
      - "127.0.0.1:${MYSQL_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./docker/data/mysql:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    restart: always
    networks:
      - device-network

  redis:
    image: ${DOCKER_REGISTRY}redis:7.2
    container_name: qd-126-redis
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - ./docker/data/redis:/data
    restart: always
    networks:
      - device-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - DOCKER_REGISTRY=${DOCKER_REGISTRY}
    container_name: qd-126-backend
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8121"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - mysql
      - redis
    volumes:
      - ./docker/data/transfer:/app/transfer
    restart: always
    networks:
      - device-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - DOCKER_REGISTRY=${DOCKER_REGISTRY}
    container_name: qd-126-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:80"
    depends_on:
      - backend
    restart: always
    networks:
      - device-network

networks:
  device-network:
    driver: bridge
